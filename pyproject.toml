[build-system]
requires = ["setuptools>=68,<82", "wheel>=0.41,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-dietcode-plugin"
version = "1.8.0"
description = "BroccoliDB, BroccoliQ, JoyZoning governance, and JSDP for Hermes Agent"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "DietCode" }]
keywords = ["hermes", "hermes-agent", "dietcode", "broccolidb", "joyzoning"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "pyyaml>=6.0.2,<7",
]

[project.entry-points."hermes_agent.plugins"]
dietcode = "plugins.dietcode"

[project.urls]
Homepage = "https://github.com/NousResearch/hermes-agent"
Documentation = "docs/README.md"

[tool.setuptools]
package-dir = { "plugins" = "shim/plugins", "plugins.dietcode" = "dietcode" }

[tool.setuptools.packages.find]
where = ["."]
include = ["plugins", "plugins.*"]

[tool.setuptools.package-data]
"plugins.dietcode" = [
  "plugin.yaml",
  "broccolidb/**/*",
  "!broccolidb/node_modules/**",
  "!broccolidb/scratch/**",
  "!broccolidb/**/*.db",
]
