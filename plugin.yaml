name: dietcode
version: 1.11.0
description: >
  BroccoliDB, JoyZoning governance, JSDP, native roadmap checkpoint
  toolset, and native mutation runtime (dietcode_kernel) for Hermes Agent.
  Drag-and-drop to ~/.hermes/plugins/dietcode/ — auto_enable handles the rest.
  Run npm ci once in broccolidb/. Verify with /dietcode doctor.
author: DietCode
kind: standalone
auto_enable: true
provides_hooks:
  - on_session_start
  - on_session_end
  - pre_tool_call
  - post_tool_call
  - transform_tool_result
